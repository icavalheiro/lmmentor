<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="lg-title">
    <title id="lg-title">LMMentor — staff crystal orbited by the four elements</title>

    <defs>
        <radialGradient id="lg-bg" cx="0.5" cy="0.4" r="0.8">
            <stop offset="0" stop-color="#3B1D6E"/>
            <stop offset="0.6" stop-color="#22103F"/>
            <stop offset="1" stop-color="#120827"/>
        </radialGradient>
        <radialGradient id="lg-aura" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#E879F9" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="lg-crystal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FDF4FF"/>
            <stop offset="0.45" stop-color="#F0ABFC"/>
            <stop offset="1" stop-color="#A855F7"/>
        </linearGradient>
    </defs>

    <!-- Badge -->
    <circle cx="256" cy="256" r="248" fill="url(#lg-bg)"/>
    <circle cx="256" cy="256" r="236" fill="none" stroke="#8B5CF6" stroke-width="16" stroke-opacity="0.9"/>

    <!-- Crystal halo + elemental orbit -->
    <circle cx="256" cy="256" r="168" fill="url(#lg-aura)"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#C4B5FD" stroke-width="11" stroke-dasharray="24 36" stroke-opacity="0.55"/>

    <!-- Air, fire, water, earth -->
    <circle cx="136" cy="136" r="46" fill="#2DD4BF"/>
    <circle cx="376" cy="136" r="46" fill="#FB7185"/>
    <circle cx="136" cy="376" r="46" fill="#38BDF8"/>
    <circle cx="376" cy="376" r="46" fill="#4ADE80"/>

    <!-- Crystal -->
    <polygon points="256,96 348,256 256,416 164,256" fill="url(#lg-crystal)"/>
    <polygon points="256,156 308,256 256,356 204,256" fill="#FDF4FF" fill-opacity="0.75"/>
</svg>
