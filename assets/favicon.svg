<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LMMentor">
  <defs>
    <radialGradient id="fv-bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3B1D6E"/>
      <stop offset="0.6" stop-color="#22103F"/>
      <stop offset="1" stop-color="#120827"/>
    </radialGradient>
    <radialGradient id="fv-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E879F9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fv-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF4FF"/>
      <stop offset="0.45" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Emblema: o cristal do cajado com os quatro elementos em órbita -->
  <circle cx="32" cy="32" r="31" fill="url(#fv-bg)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="32" cy="32" r="21" fill="url(#fv-aura)"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#C4B5FD" stroke-width="1.4" stroke-dasharray="3 4.5" stroke-opacity="0.55"/>

  <!-- Ar, fogo, água, terra -->
  <circle cx="17" cy="17" r="5.8" fill="#2DD4BF"/>
  <circle cx="47" cy="17" r="5.8" fill="#FB7185"/>
  <circle cx="17" cy="47" r="5.8" fill="#38BDF8"/>
  <circle cx="47" cy="47" r="5.8" fill="#4ADE80"/>

  <!-- Cristal -->
  <polygon points="32,12 43.5,32 32,52 20.5,32" fill="url(#fv-crystal)"/>
  <polygon points="32,19.5 38.5,32 32,44.5 25.5,32" fill="#FDF4FF" fill-opacity="0.75"/>
</svg>
