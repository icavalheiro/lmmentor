name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/LMMentor.AdminUI/package-lock.json

      - name: Install Admin UI dependencies
        working-directory: src/LMMentor.AdminUI
        run: npm ci

      - name: Lint Admin UI
        working-directory: src/LMMentor.AdminUI
        run: npm run lint

      - name: Build Admin UI
        working-directory: src/LMMentor.AdminUI
        run: npm run build

      - name: Restore .NET dependencies
        run: dotnet restore src/LMMentor.slnx

      - name: Build backend
        run: dotnet build src/LMMentor.slnx --no-restore

      - name: Run .NET tests
        run: dotnet test src/LMMentor.slnx --no-restore
