<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background Gradients -->
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3b0764" stop-opacity="0.8"/>
            <stop offset="60%" stop-color="#1e1035" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#0f071c" stop-opacity="1"/>
        </radialGradient>
        <radialGradient id="staffAura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
            <stop offset="40%" stop-color="#9333ea" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
        </radialGradient>

        <!-- Robe Gradients -->
        <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9333ea"/>
            <stop offset="40%" stop-color="#6b21a8"/>
            <stop offset="100%" stop-color="#3b0764"/>
        </linearGradient>
        <linearGradient id="robeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#7e22ce"/>
        </linearGradient>
        <linearGradient id="hoodGrad" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#7e22ce"/>
            <stop offset="50%" stop-color="#581c87"/>
            <stop offset="100%" stop-color="#2e1065"/>
        </linearGradient>
        <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="50%" stop-color="#eab308"/>
            <stop offset="100%" stop-color="#ca8a04"/>
        </linearGradient>

        <!-- Staff Gradients -->
        <linearGradient id="woodStaff" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#78350f"/>
            <stop offset="40%" stop-color="#92400e"/>
            <stop offset="70%" stop-color="#b45309"/>
            <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>
        <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdf4ff"/>
            <stop offset="40%" stop-color="#e879f9"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>

        <!-- Element Gradients -->
        <!-- 1. Fire -->
        <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#dc2626"/>
            <stop offset="45%" stop-color="#ea580c"/>
            <stop offset="80%" stop-color="#facc15"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
        </radialGradient>

        <!-- 2. Water -->
        <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="40%" stop-color="#38bdf8"/>
            <stop offset="80%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>
        <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>

        <!-- 3. Air -->
        <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#a7f3d0"/>
            <stop offset="80%" stop-color="#5eead4"/>
            <stop offset="100%" stop-color="#0d9488"/>
        </linearGradient>
        <radialGradient id="airGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
        </radialGradient>

        <!-- 4. Earth -->
        <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#86efac"/>
            <stop offset="40%" stop-color="#22c55e"/>
            <stop offset="70%" stop-color="#15803d"/>
            <stop offset="100%" stop-color="#78350f"/>
        </linearGradient>
        <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
        </radialGradient>

        <!-- Glow Filters -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="elementGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background Circle / Emblem -->
    <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#6b21a8" stroke-width="4" stroke-opacity="0.6"/>
    <circle cx="256" cy="256" r="226" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4"/>

    <!-- Magical Background Runes/Rays -->
    <g opacity="0.18" stroke="#d8b4fe" stroke-width="1.5">
        <line x1="256" y1="36" x2="256" y2="476" stroke-dasharray="12 8"/>
        <line x1="36" y1="256" x2="476" y2="256" stroke-dasharray="12 8"/>
        <line x1="100" y1="100" x2="412" y2="412" stroke-dasharray="6 10"/>
        <line x1="100" y1="412" x2="412" y2="100" stroke-dasharray="6 10"/>
        <circle cx="256" cy="256" r="170" fill="none" stroke-dasharray="4 8"/>
    </g>

    <!-- WIZARD FIGURE -->
    <g id="wizard">
        <!-- Back Cloak Shadow -->
        <path d="M 120 460 Q 150 250 190 200 L 260 200 Q 300 250 330 460 Z" fill="#240747"/>

        <!-- Main Robe Body -->
        <path d="M 130 465 Q 170 260 200 210 L 280 210 Q 310 260 340 465 Q 235 480 130 465 Z" fill="url(#robeGrad)"/>

        <!-- Robe Folds and Highlights -->
        <path d="M 200 210 Q 220 340 180 465" stroke="url(#robeHighlight)" stroke-width="4" fill="none" opacity="0.8"/>
        <path d="M 240 215 Q 248 350 238 470" stroke="#3b0764" stroke-width="5" fill="none" opacity="0.9"/>
        <path d="M 280 210 Q 260 340 295 465" stroke="url(#robeHighlight)" stroke-width="3" fill="none" opacity="0.8"/>

        <!-- Gold Stole / Trim -->
        <path d="M 210 210 Q 235 320 220 450 L 235 450 Q 250 320 230 210 Z" fill="url(#goldTrim)" opacity="0.9"/>
        <path d="M 270 210 Q 245 320 260 450 L 245 450 Q 230 320 250 210 Z" fill="url(#goldTrim)" opacity="0.9"/>

        <!-- Wizard Beard & Hair -->
        <path d="M 205 175 Q 240 290 240 310 Q 240 290 275 175 Q 240 200 205 175 Z" fill="#e2e8f0"/>
        <path d="M 215 180 Q 240 270 240 285 Q 240 270 265 180 Q 240 195 215 180 Z" fill="#cbd5e1"/>
        <path d="M 230 190 Q 240 250 240 265 Q 240 250 250 190 Z" fill="#ffffff"/>

        <!-- Wizard Face / Shadow -->
        <ellipse cx="240" cy="165" rx="22" ry="20" fill="#fbcfe8"/>
        <path d="M 218 160 Q 240 175 262 160 Q 260 145 240 145 Q 220 145 218 160 Z" fill="#1e1035"/>

        <!-- Glowing Wise Eyes -->
        <ellipse cx="230" cy="162" rx="3" ry="2" fill="#38bdf8" filter="url(#glow)"/>
        <ellipse cx="250" cy="162" rx="3" ry="2" fill="#38bdf8" filter="url(#glow)"/>
        <circle cx="230" cy="162" r="1.5" fill="#ffffff"/>
        <circle cx="250" cy="162" r="1.5" fill="#ffffff"/>

        <!-- Wizard Hood & Pointed Hat -->
        <!-- Hood Drape -->
        <path d="M 195 175 Q 180 230 205 235 L 275 235 Q 300 230 285 175 Q 240 135 195 175 Z" fill="url(#hoodGrad)"/>
        <!-- Hat Brim -->
        <path d="M 175 155 Q 240 135 305 155 Q 240 170 175 155 Z" fill="#581c87" stroke="#7e22ce" stroke-width="2"/>
        <path d="M 185 154 Q 240 140 295 154" stroke="url(#goldTrim)" stroke-width="3" fill="none"/>
        <!-- Hat Cone -->
        <path d="M 198 148 Q 235 90 270 45 Q 275 65 260 100 Q 285 148 282 148 Z" fill="url(#hoodGrad)"/>
        <path d="M 270 45 Q 295 40 305 55 Q 285 75 270 65 Z" fill="#3b0764"/>
        <circle cx="306" cy="56" r="4" fill="#facc15" filter="url(#glow)"/>

        <!-- Wizard Left Arm holding staff -->
        <!-- Sleeve -->
        <path d="M 270 220 Q 320 240 350 265 L 340 285 Q 305 260 265 245 Z" fill="url(#robeGrad)"/>
        <path d="M 335 260 L 355 280 L 340 290 L 325 270 Z" fill="url(#goldTrim)"/>
        <!-- Hand -->
        <ellipse cx="348" cy="272" rx="10" ry="8" fill="#fbcfe8" transform="rotate(-20 348 272)"/>
    </g>

    <!-- STAFF & ELEMENTAL MAGIC -->
    <g id="staff-and-elements">
        <!-- Staff Wooden Shaft -->
        <path d="M 360 120 L 335 470 L 347 470 L 372 120 Z" fill="url(#woodStaff)" stroke="#270e02" stroke-width="1.5"/>
        <path d="M 362 135 L 343 455" stroke="#b45309" stroke-width="2" opacity="0.6"/>

        <!-- Staff Head / Prongs -->
        <path d="M 370 140 Q 395 110 390 75 Q 375 75 365 95 Z" fill="url(#woodStaff)" stroke="#451a03" stroke-width="1.5"/>
        <path d="M 362 140 Q 335 110 340 75 Q 355 75 365 95 Z" fill="url(#woodStaff)" stroke="#451a03" stroke-width="1.5"/>
        <path d="M 366 145 L 366 90" stroke="url(#goldTrim)" stroke-width="3"/>

        <!-- Staff Core Crystal Glow Aura -->
        <circle cx="366" cy="90" r="55" fill="url(#staffAura)"/>

        <!-- Staff Crystal Core (Levitating) -->
        <polygon points="366,60 380,85 366,115 352,85" fill="url(#crystalGrad)" filter="url(#glow)"/>
        <polygon points="366,65 375,85 366,105 357,85" fill="#ffffff" opacity="0.7"/>

        <!-- ORBITAL RINGS AROUND STAFF CRYSTAL (4 Elements Motion) -->
        <!-- Orbit 1 -->
        <ellipse cx="366" cy="90" rx="65" ry="32" fill="none" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" transform="rotate(-25 366 90)"/>
        <!-- Orbit 2 -->
        <ellipse cx="366" cy="90" rx="65" ry="32" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" transform="rotate(50 366 90)"/>

        <!-- ELEMENT 1: FIRE (Top / Right) -->
        <g id="element-fire" transform="translate(420, 55)" filter="url(#elementGlow)">
            <circle cx="0" cy="0" r="22" fill="url(#fireGlow)"/>
            <!-- Flame Shapes -->
            <path d="M 0 16 C -12 10 -16 -4 0 -22 C 3 -10 12 -6 10 2 C 14 -2 15 -8 13 -14 C 20 -4 16 12 0 16 Z" fill="url(#fireGrad)"/>
            <path d="M 0 12 C -6 8 -8 0 0 -12 C 2 -6 6 -4 5 1 C 8 -1 8 -5 7 -9 C 11 -2 9 9 0 12 Z" fill="#fef08a"/>
            <!-- Sparkles -->
            <circle cx="-12" cy="-14" r="2" fill="#fef08a"/>
            <circle cx="14" cy="-8" r="1.5" fill="#f97316"/>
        </g>

        <!-- ELEMENT 2: WATER (Top / Left) -->
        <g id="element-water" transform="translate(305, 60)" filter="url(#elementGlow)">
            <circle cx="0" cy="0" r="22" fill="url(#waterGlow)"/>
            <!-- Water Droplet & Swirl -->
            <path d="M 0 -20 C 14 -4 16 10 6 16 C -6 22 -18 12 -16 2 C -14 -6 -6 -12 0 -20 Z" fill="url(#waterGrad)"/>
            <!-- Water Swirl Highlight -->
            <path d="M -6 -2 C -2 -10 6 -8 8 -2 C 10 5 4 10 -2 9 C -8 8 -10 2 -6 -2 Z" fill="#e0f2fe" opacity="0.8"/>
            <circle cx="0" cy="3" r="3" fill="#ffffff"/>
            <!-- Droplets -->
            <circle cx="-14" cy="14" r="2.5" fill="#38bdf8"/>
            <circle cx="12" cy="-12" r="2" fill="#7dd3fc"/>
        </g>

        <!-- ELEMENT 3: AIR / WIND (Bottom / Left) -->
        <g id="element-air" transform="translate(315, 130)" filter="url(#elementGlow)">
            <circle cx="0" cy="0" r="22" fill="url(#airGlow)"/>
            <!-- Vortex / Cyclone Wisps -->
            <path d="M -16 -8 Q 0 -16 14 -8 Q 18 -2 10 0 Q -4 -2 -6 6 Q -8 14 2 16 Q 12 18 16 10" fill="none" stroke="url(#airGrad)" stroke-width="4" stroke-linecap="round"/>
            <path d="M -10 -2 Q 0 -8 10 -2 Q 6 4 -2 4 Q -6 6 0 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Wind Particles -->
            <circle cx="-12" cy="10" r="2" fill="#a7f3d0"/>
            <circle cx="14" cy="-12" r="1.5" fill="#ffffff"/>
        </g>

        <!-- ELEMENT 4: EARTH / NATURE (Bottom / Right) -->
        <g id="element-earth" transform="translate(425, 125)" filter="url(#elementGlow)">
            <circle cx="0" cy="0" r="22" fill="url(#earthGlow)"/>
            <!-- Floating Crystal / Geode Rocks -->
            <polygon points="0,-18 14,-6 10,14 -8,16 -16,0" fill="url(#earthGrad)"/>
            <polygon points="0,-14 10,-4 6,10 -4,12 -10,0" fill="#4ade80" opacity="0.7"/>
            <polygon points="0,-10 6,-3 4,6 -2,7 -6,0" fill="#bbf7d0"/>
            <!-- Floating Gem Shards / Leaves -->
            <polygon points="-16,-10 -10,-12 -12,-6" fill="#22c55e"/>
            <polygon points="12,12 18,10 14,16" fill="#86efac"/>
            <circle cx="15" cy="-8" r="2" fill="#fbbf24"/>
        </g>

        <!-- Magical Elemental Streams connecting to crystal center -->
        <path d="M 420 55 Q 390 65 366 90" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
        <path d="M 305 60 Q 335 70 366 90" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
        <path d="M 315 130 Q 340 115 366 90" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
        <path d="M 425 125 Q 395 110 366 90" stroke="#4ade80" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
    </g>

    <!-- Front Sparkles & Magic Dust -->
    <g filter="url(#glow)" fill="#ffffff" opacity="0.9">
        <circle cx="366" cy="90" r="3"/>
        <polygon points="366,78 369,87 378,90 369,93 366,102 363,93 354,90 363,87" fill="#ffffff"/>
        <polygon points="256,40 258,46 264,48 258,50 256,56 254,50 248,48 254,46" fill="#e9d5ff" opacity="0.7"/>
    </g>
</svg>
