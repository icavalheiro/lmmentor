services:
  lmmentor:
    build: .
    image: lmmentor
    container_name: lmmentor
    # Rede do host: o container acessa diretamente os serviços da máquina
    # (ex.: Ollama em http://localhost:11434) sem tradução de portas.
    network_mode: host
    environment:
      # Com network_mode: host não há mapeamento de portas; a aplicação
      # escuta diretamente na porta do host.
      ASPNETCORE_URLS: http://+:6565
    ports: #map ports on windows hosts
      - 6565:6565
    volumes:
      - lmmentor-data:/data
    # Rotação de logs do container: o Docker não suporta retenção por tempo,
    # então a rotação é por tamanho (3 x 10 MB = teto de 30 MB). Ajuste
    # max-size/max-file ao volume diário esperado para aproximar 1 dia.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  lmmentor-data:
